# The walks of this class. The walks show and do are the same tutorial: the tagged steps of smallwikiapp, and the
# moves between them. They differ only in the mode they start in; the Do/Watch switch changes it at any time.
# Every path is read from this folder.

[[walk]]
id = "show"
title = "smallwikiapp"
description = "Watch a small command and its project grow, one change at a time, with tests, a library, lint, types, CI, docs and a build."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]   # compared without the versions: a later uv add writes newer ones
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"  # what the copies say before the first step, in place of the notes' opening
moves = "watch"                   # Show checks out each move's commit: for the projector

[[walk]]
id = "do"
title = "Build smallwikiapp"
description = "Build the project yourself, one change at a time, from the text. Each change ends with a command that shows what it did."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"
moves = "do"                      # the student makes each move from the notes, and presses Done

# The small walks have notes of their own, walks/ID/notes.md. Their {{include}} lines take sections of
# walks/tutorial/notes.md, with the same slides and commits. Each starts in watch mode.

[[walk]]
id = "testing"
title = "The tests"
description = "The project and its command, then pytest, fixtures and mocks, coverage, end-to-end tests, and the tests on GitHub, with their own group."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/testing/notes.md"    # its own notes: an intro, and a ## stop for each place, with its includes
shared = "walks/tutorial/notes.md"  # the notes that its {{include ...}} lines take move sections from
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "linting"
title = "Format and lint"
description = "The project and its command, then a formatter and a linter, their fixes, a check of the configuration, and every check before each `git commit`."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/linting/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "docs"
title = "The docs"
description = "The project and its command, then documentation of the code, a check of it, a site built with smalldocs, and the site on GitHub Pages."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/docs/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "just"
title = "just"
description = "The project and its first justfile, then each verb as it comes in, and `just check`. A person and a git hook run it before each `git commit`, and GitHub after a push."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/just/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "uv"
title = "uv"
description = "The project and its `.venv`, then the lockfile, dependency groups, and when uv syncs. Then Python versions, environments, a group for each job on GitHub, a workspace of two packages, and a build."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]
notes = "walks/uv/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"
