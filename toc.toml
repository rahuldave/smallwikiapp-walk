# The walks of this class. Both are the same tutorial: the tagged steps of smallwikiapp, and the moves
# between them. They differ only in the mode they start in; the Do/Watch switch changes it at any time.
# Every path is read from this folder.

[[walk]]
id = "show"
title = "smallwikiapp, shown one move at a time"
description = "Watch a small command and its project grow, one commit at a time: tests, a library, lint, types, CI, docs and a build."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]   # compared without the versions: a later uv add writes newer ones
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"  # what the copies say before the first step, in place of the notes' opening
moves = "watch"                   # Show checks out each move's commit: for the projector

[[walk]]
id = "do"
title = "smallwikiapp, one move at a time, by hand"
description = "Build the project yourself, one move at a time, from the notes. Each move ends with a command that shows what it did."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"
moves = "do"                      # the student makes each move from the notes, and presses Done

# The small walks take parts of the same tutorial: the same notes, slides and commits. Each starts in watch mode.
# select names whole steps, single moves, and ranges of moves inside one step, in the order of the history.

[[walk]]
id = "testing"
title = "Testing smallwikiapp, one move at a time"
description = "The project and its command, then the moves of smallwikiapp that add pytest, fixtures and mocks, coverage, end-to-end tests, and the tests on GitHub."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
intro = "walks/testing/intro.md"  # what the copies say before the first step
moves = "watch"
select = [
  { range = "step-00", title = "The project" },
  { range = "step-01", title = "The command under test" },
  { range = "step-02.1..step-02.2", title = "pytest and a first test" },
  { range = "step-02.3..step-02.6", title = "Fixtures and mocks" },
  { range = "step-02.7", title = "Coverage" },
  { range = "step-03.2", title = "A shared mock in conftest.py" },
  { range = "step-03.3", title = "A test of the language" },
  { range = "step-03.6", title = "A test of an error message" },
  { range = "step-04.9", title = "`just check`, with a coverage floor" },
  { range = "step-06.1..step-06.2", title = "End-to-end tests, on request" },
  { range = "step-06.3..step-06.4", title = "The tests on GitHub" },
  { range = "step-07.2..step-07.3", title = "Tests of a model" },
  { range = "step-07.4", title = "A drop in coverage" },
]

[[walk]]
id = "linting"
title = "Linting smallwikiapp, one move at a time"
description = "The project and its command, then the moves of smallwikiapp that add a formatter and a linter, fix what the linter finds, check the configuration, and run every check before a commit."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
intro = "walks/linting/intro.md"
moves = "watch"
select = [
  { range = "step-00", title = "The project" },
  { range = "step-01", title = "The command" },
  { range = "step-04.1..step-04.2", title = "A formatter" },
  { range = "step-04.3", title = "The linter's rules" },
  { range = "step-04.4..step-04.6", title = "The linter's problems, fixed" },
  { range = "step-04.7", title = "A check of the configuration" },
  { range = "step-04.9", title = "`just check`, every check in one recipe" },
  { range = "step-04.10", title = "A git hook" },
  { range = "step-05.3..step-05.5", title = "The linter asks for types" },
  { range = "step-10.3", title = "The library's pyproject.toml too" },
]

[[walk]]
id = "docs"
title = "Documenting smallwikiapp, one move at a time"
description = "The moves of smallwikiapp that document the code, check the documentation, and build a site with smalldocs."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
intro = "walks/docs/intro.md"
moves = "watch"
select = ["step-08", "step-09.4"]
