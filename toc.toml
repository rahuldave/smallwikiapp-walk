# The walks of this class. The walks show and do are the same tutorial: the tagged steps of smallwikiapp, and the
# moves between them. They differ only in the mode they start in; the Do/Watch switch changes it at any time.
# Every path is read from this folder.

[[walk]]
id = "show"
title = "smallwikiapp, shown one move at a time"
description = "Watch a small command and its project grow, one commit at a time: tests, a library, lint, types, CI, docs and a build."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]   # compared without the versions: a later uv add writes newer ones
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"  # what the copies say before the first step, in place of the notes' opening
moves = "watch"                   # Show checks out each move's commit: for the projector

[[walk]]
id = "do"
title = "smallwikiapp, one move at a time, by hand"
description = "Build the project yourself, one move at a time, from the notes. Each move ends with a command that shows what it did."
kind = "tutorial"
loose = ["pyproject.toml", "packages/wikirandom/pyproject.toml", "uv.lock"]
folder = "walks/tutorial"
intro = "walks/tutorial/intro.md"
moves = "do"                      # the student makes each move from the notes, and presses Done

# The small walks have notes of their own, walks/ID/notes.md. Their {{include}} lines take sections of
# walks/tutorial/notes.md, with the same slides and commits. Each starts in watch mode.

[[walk]]
id = "testing"
title = "Testing smallwikiapp, one move at a time"
description = "The project and its command, then the moves of smallwikiapp that add pytest, fixtures and mocks, coverage, end-to-end tests, and the tests on GitHub."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/testing/notes.md"    # its own notes: an intro, and a ## stop for each place, with its includes
shared = "walks/tutorial/notes.md"  # the notes that its {{include ...}} lines take move sections from
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "linting"
title = "Linting smallwikiapp, one move at a time"
description = "The project and its command, then the moves of smallwikiapp that add a formatter and a linter, fix what the linter finds, check the configuration, and run every check before a commit."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/linting/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "docs"
title = "Documenting smallwikiapp, one move at a time"
description = "The project and its command, then the moves of smallwikiapp that document the code, check the documentation, and build a site with smalldocs."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/docs/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"

[[walk]]
id = "just"
title = "just, the interface of smallwikiapp, one move at a time"
description = "The project and its first justfile, then each verb as it comes in, and just check, which a person and a git hook run before a commit, and GitHub after a push."
kind = "tutorial"
loose = ["pyproject.toml", "uv.lock"]
notes = "walks/just/notes.md"
shared = "walks/tutorial/notes.md"
slides = "walks/tutorial/slides/slides.toml"
moves = "watch"
