# The tutorial's website: on every push to main, smalldocs builds site/ and GitHub Pages publishes it at
# https://rahuldave.com/smallwikiapp-walk/. site/ is made from the notes by the teacher's walk-update.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write  # to publish the site
  id-token: write  # to prove to Pages that this workflow is the one publishing

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --from 'smalldocs>=0.1.3' smalldocs render site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
